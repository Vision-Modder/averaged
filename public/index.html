<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Averaged</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="topbar">
        <div class="news"></div>
        <div class="iconrow">
            <button class="teams"><img src="SVGs/user-group.svg" alt="teams" class="teamssvg"></button>
            <button class="shop"><img src="SVGs/store.svg" alt="shop" class="shopsvg"></button>
            <button class="home"><img src="SVGs/info.svg" alt="about" class="homesvg"></button>
            <button class="settings"><img src="SVGs/settings.svg" alt="settings" class="settingssvg"></button>
        </div>
    </div>
    <div class="dividor"></div>
    <div class="main">
        <div class="leftside">
            <button class="leaderboard"><img src="SVGs/podium.svg" alt="leaderboard" class="leaderboardsvg"></button>
            <button class="history"><img src="SVGs/clipboard-clock.svg" alt="history" class="historysvg"></button>
            <button class="boosters"><img src="SVGs/rocket.svg" alt="boosters" class="boosterssvg"></button>
            <button class="achievements"><img src="SVGs/trophy.svg" alt="achievements" class="achievementssvg"></button>
            <button class="stats"><img src="SVGs/circle-user-round.svg" alt="stats" class="statssvg"></button>
        </div>
        <div class="leftsidepanel">
            <div class="app-section" id="leaderboard">
                <div class="title">Leaderboard</div>
                <div class="leaderboard-filters">
                    <button class="leaderboard-filters-player">Player</button>
                    <button class="leaderboard-filters-team">Team</button>
                </div>
                <div class="leaderboard-list"></div>
            </div>
            <div class="app-section" id="history">
                <div class="title">History</div>
                <div class="history-filters">
                    <button class="history-filters-number">Number</button>
                    <button class="history-filters-playersjoined">Players Joined</button>
                    <button class="history-filters-teamsmade">Teams Made</button>
                </div>
                <div class="history-main"></div>
            </div>
            <div class="app-section" id="boosters">
                <div class="title">Boosters</div>
                <div class="boosters-main"></div>
            </div>
            <div class="app-section" id="achievements">
                <div class="title">Achievements</div>
                <div class="achievements-main"></div>
            </div>
            <div class="app-section" id="stats">
                <div class="title">Stats</div>
            </div>
        </div>
        <div class="number">
            <div class="globalnum">
                <span class="numberdisplay">number not available</span>
                <div class="sub"></div>
                <div class="add"></div>
            </div>
        </div>
        <div class="rightsidepanel">
            <div class="app-section" id="leaderboard">
                <div class="title">Leaderboard</div>
                <div class="leaderboard-filters">
                    <button class="leaderboard-filters-player">Player</button>
                    <button class="leaderboard-filters-team">Team</button>
                </div>
                <div class="leaderboard-list"></div>
            </div>
            <div class="app-section" id="history">
                <div class="title">History</div>
                <div class="history-filters">
                    <button class="history-filters-number">Number</button>
                    <button class="history-filters-playersjoined">Players Joined</button>
                    <button class="history-filters-teamsmade">Teams Made</button>
                </div>
                <div class="history-main"></div>
            </div>
            <div class="app-section" id="boosters">
                <div class="title">Boosters</div>
                <div class="boosters-main"></div>
            </div>
            <div class="app-section" id="achievements">
                <div class="title">Achievements</div>
                <div class="achievements-main"></div>
            </div>
            <div class="app-section" id="stats">
                <div class="title">Stats</div>
            </div>
        </div>
        <div class="rightside">
            <button class="leaderboard"><img src="SVGs/podium.svg" alt="leaderboard" class="leaderboardsvg"></button>
            <button class="history"><img src="SVGs/clipboard-clock.svg" alt="history" class="historysvg"></button>
            <button class="boosters"><img src="SVGs/rocket.svg" alt="boosters" class="boosterssvg"></button>
            <button class="achievements"><img src="SVGs/trophy.svg" alt="achievements" class="achievementssvg"></button>
            <button class="stats"><img src="SVGs/circle-user-round.svg" alt="stats" class="statssvg"></button>
        </div>
    </div>
    <div class="dividor"></div>
    <div class="lowbar">
        <span class="totalclicks">0</span>
        <span class="pendingchange">0</span>
    </div>
    <div class="overlay">
    <div class="shop-popup">
        <div class="shoptop">
            <div class="shoptitle">Shop</div>
            <div class="shopfilter">
                <button class="shopfilterpersonal">Personal</button>
                <button class="shopfilterteam">Team</button>
                <button class="shopfilterglobal">Global</button>
                <button class="shopfilterboost">Boost</button>
                <button class="shopfiltercosmetic">Cosmetic</button>
                <button class="shopfilteroffline">Offline</button>
            </div>
        </div>
        <div class="shopmain">
            
        </div>
    </div>
    <div class="teams-popup">
        <div class="teamstop">
            <div class="teamstitle">Teams</div>
            <div class="teamsactions">
                <button class="teamsactionsjoin">Join a team</button>
                <button class="teamsactionsleave">Leave current team</button>
                <button class="teamsactionsinfo">Extra information about a team</button>
            </div>
        </div>
        <div class="teamsmain">
            
        </div>
    </div>
    <div class="home-popup">
        <div class="hometop">
            <div class="hometitle">Information</div>
            <div class="homeactions">
                <button class="homeactionscoffee">Buy me a coffee</button>
                <button class="homeactionschannel">Go to Youtube Channel</button>
                <button class="homeactionsbugreport">Bug report</button>
            </div>
        </div>
        <div class="homemain">
            
        </div>
    </div>
    <div class="settings-popup">
        <div class="settingstop">
            <div class="settingstitle">Settings</div>
            <div class="settingsactions">
                <button class="settingsactionsmute">Mute sounds</button>
                <button class="settingsactionstheme">Change theme(light/dark)</button>
                <button class="settingsactionsanimation">Toggle animations</button>
            </div>
        </div>
        <div class="settingsmain">
            
        </div>
    </div>
</div>
<script src="game.js"></script>
<script src="network.js"></script>
</body>
</html>
