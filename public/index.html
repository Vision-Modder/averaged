<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Averaged</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="topbar">
        <div class="news"></div>
        <div class="iconrow">
            <button class="shop"><img src="SVGs/store.svg" alt="shop" class="shopsvg"></button>
            <button class="home"><img src="SVGs/house.svg" alt="home" class="homesvg"></button>
            <button class="settings"><img src="SVGs/settings.svg" alt="settings" class="settingssvg"></button>
        </div>
    </div>
    <div class="dividor"></div>
    <div class="main">
        <div class="leftside"></div>
        <div class="number">
            <div class="globalnum">
                <span class="numberdisplay">0.00000</span>
                <div class="sub"></div>
                <div class="add"></div>
            </div>
        </div>
        <div class="rightside"></div>
    </div>
    <div class="dividor"></div>
    <div class="lowbar">
        <span class="totalclicks">0</span>
        <span class="pendingchange">0</span>
    </div>
    <div class="overlay">
    <div class="shop-popup">
        <div class="shoptop">
            <div class="shoptitle"></div>
            <div class="shopfilter">
                <div class="shopfilterpersonal"></div>
                <div class="shopfilterteam"></div>
                <div class="shopfilterglobal"></div>
                <div class="shopfilterboost"></div>
                <div class="shopfilteroffline"></div>
            </div>
        </div>
        <div class="shopmain">
            <div class="shoplist-clickshow">
                <img class="shoplist-clickshow-img">
                <div class="shoplist-clickshow-title"></div>
                <div class="shoplist-clickshow-description"></div>
                <div class="shoplist-clickshow-filter"></div>
                <div class="shoplist-clickshow-buy"></div>
            </div>
            <div class="shoplist-autoclick">
                
            </div>
            <div class="shoplist-clickboost">
                
            </div>
            <div class="shoplist-teammaker">
                
            </div>
            <div class="shoplist-globalsurge">
                
            </div>
            <div class="shoplist-newsbarmsg">
                
            </div>
        </div>
    </div>
</div>
<script src="game.js"></script>
<script src="network.js"></script>
<script src="batcher.js"></script>
</body>
</html>
